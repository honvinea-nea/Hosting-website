<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products · Bloom & Blossom Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#111111', cream: '#F3EFE6', taupe: '#B8AA96',
            navy: '#1E293B', muted: '#64748B', page: '#F8F8F6',
            success: '#16A34A', warning: '#F59E0B', danger: '#DC2626'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            brand: ['"Playfair Display"', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="bg-page text-navy font-sans">
  <div id="sidebar-root"></div>
  <div id="app-shell" class="app-shell">
    <div id="topbar-root"></div>
    <main class="p-4 md:p-6 lg:p-8">
      <div id="products-root">
        <p class="text-sm text-muted">Loading products…</p>
      </div>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div id="product-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-ink/40">
    <div class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl bg-white border border-[#ece8df] shadow-xl">
      <div class="flex items-center justify-between px-5 py-4 border-b border-[#ece8df] sticky top-0 bg-white">
        <h3 id="modal-title" class="font-semibold text-ink">Add product</h3>
        <button type="button" id="modal-close" class="icon-btn" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <form id="product-form" class="p-5 space-y-4">
        <div id="form-error" class="hidden rounded-xl bg-red-50 text-red-700 text-sm px-3 py-2"></div>
        <div>
          <label class="block text-xs font-medium text-muted mb-1">Product name *</label>
          <input id="f-name" required class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
        </div>
        <div>
          <label class="block text-xs font-medium text-muted mb-1">Description</label>
          <textarea id="f-desc" rows="2" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-muted mb-1">Image URL</label>
          <input id="f-image" placeholder="images/… or https://…" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-muted mb-1">SKU</label>
            <input id="f-sku" placeholder="Auto if empty" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Category</label>
            <input id="f-category" placeholder="e.g. roses" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Price *</label>
            <input id="f-price" type="number" min="0" step="0.01" required class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Discount price</label>
            <input id="f-discount" type="number" min="0" step="0.01" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Stock *</label>
            <input id="f-stock" type="number" min="0" step="1" required class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Status</label>
            <select id="f-status" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink">
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Sizes (comma-separated)</label>
            <input id="f-sizes" placeholder="S, M, L" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Colors (comma-separated)</label>
            <input id="f-colors" placeholder="Black, Cream" class="w-full rounded-xl border border-[#ece8df] bg-page px-3 py-2 text-sm focus:outline-none focus:border-ink" />
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm text-navy">
          <input type="checkbox" id="f-featured" class="rounded border-[#ece8df]" />
          Featured product
        </label>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 rounded-xl bg-ink text-white py-2.5 text-sm font-medium hover:bg-navy">Save product</button>
          <button type="button" id="modal-cancel" class="rounded-xl border border-[#ece8df] px-4 py-2.5 text-sm font-medium hover:bg-cream">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../products.js"></script>
  <script src="../assets/js/data/store.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="../assets/js/admin/admin.js"></script>
  <script src="../assets/js/admin/products.js"></script>
</body>
</html>
