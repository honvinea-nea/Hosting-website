<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In — Bloom &amp; Blossom</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="announce">
    <div class="container">
      <span class="announce-sparkle">✦</span>
      <span>Complimentary handwritten note &amp; free local delivery on orders over $75</span>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Bloom & Blossom home">Bloom &amp; Blossom<span>.</span></a>
      <nav class="nav">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </nav>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div style="font-size: 2.2rem; text-align: center; margin-bottom: 8px;">🌸</div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your customer account to view orders &amp; shop</p>
      
      <div class="error-msg" id="error"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password" minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <button type="button" class="demo-pill-btn" id="demo-login-btn">
        <span>⚡ Quick 1-Click Demo Login</span>
      </button>

      <p class="auth-footer">Don't have an account yet? <a href="register.html">Create one here</a></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    if (getSession()) {
      window.location.href = 'index.html';
    }

    document.getElementById('demo-login-btn')?.addEventListener('click', () => {
      document.getElementById('email').value = 'demo@example.com';
      document.getElementById('password').value = 'password123';
      const result = login('demo@example.com', 'password123');
      if (result.ok) {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result = login(email, password);
      const err = document.getElementById('error');
      if (result.ok) {
        window.location.href = 'index.html';
      } else {
        err.textContent = result.error;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
